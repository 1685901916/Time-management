name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PATH: ${{ secrets.SERVER_PATH }}

    steps:
      - name: Check deployment secrets
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_SSH_KEY" ] || [ -z "$SERVER_PATH" ]; then
            echo "Deployment secrets are not configured. Skipping server deploy."
            exit 0
          fi
          printf '%s\n' "$SERVER_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          echo "key_line_count=$(wc -l < /tmp/deploy_key)"
          ssh-keygen -y -f /tmp/deploy_key > /tmp/deploy_key.pub
          echo "key_fingerprint=$(ssh-keygen -lf /tmp/deploy_key.pub)"
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=10 "$SERVER_USER@$SERVER_HOST" "echo ssh-auth-ok"

      - name: Deploy over SSH
        if: env.SERVER_HOST != '' && env.SERVER_USER != '' && env.SERVER_SSH_KEY != '' && env.SERVER_PATH != ''
        run: |
          ssh -i /tmp/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" \
            "SERVER_PATH='$SERVER_PATH' bash -s" <<'REMOTE'
          set -e

          SITE_DIR="$SERVER_PATH"
          APP_DIR="$SITE_DIR/app"
          REPO_URL="https://github.com/1685901916/Time-management.git"

          if ! command -v node >/dev/null 2>&1; then
            echo "Node.js is not installed on the server."
            exit 1
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            npm install -g pm2
          fi

          mkdir -p "$SITE_DIR"

          if [ -e "$APP_DIR" ] && [ ! -d "$APP_DIR/.git" ]; then
            BACKUP_DIR="$SITE_DIR/app.backup.$(date +%Y%m%d%H%M%S)"
            mv "$APP_DIR" "$BACKUP_DIR"
            echo "Existing non-git app directory moved to $BACKUP_DIR"
          fi

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data uploads
          npm ci
          npm run lint
          npm test
          npm run build
          pm2 startOrRestart ecosystem.config.cjs --env production
          pm2 save
          REMOTE
